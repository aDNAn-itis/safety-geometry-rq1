name: Notebook validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cpu.txt
      - run: pip install -r requirements-cpu.txt
      - run: python scripts/validate_notebooks.py --replay
